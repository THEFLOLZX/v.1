name: FirstLight iCloud static intake ONE RUN
on:
  workflow_dispatch:
permissions: {}
jobs:
  inspect:
    if: github.repository == 'THEFLOLZX/v.1' && github.run_number == 2 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: One secret-scoped cloud-only acquisition and static inspection
        env:
          FIRSTLIGHT_ICLOUD_SHARE_URL: ${{ secrets.FIRSTLIGHT_ICLOUD_SHARE_URL }}
        shell: bash --noprofile --norc -e {0}
        run: |
          timeout --signal=TERM --kill-after=1s 330s python3 -I - <<'FIRSTLIGHT_PY'
          """Cloud-only static intake. No network on import; never reads local credentials.

          Workflow embeds this reviewed project code and the unchanged pinned inspector.
          URLs and server metadata are deliberately absent from emitted reports/errors.
          """
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import resource
          import shutil
          import signal
          import ssl
          import zipfile
          from urllib.error import HTTPError
          from urllib.parse import urlencode, urlsplit
          from urllib.request import Request, build_opener, ProxyHandler, HTTPSHandler, HTTPRedirectHandler

          INSPECTOR_PIN = '738305850976adf79c091291b32fbd4f83a3f8562c4d3ef0f1d6170119f42339'
          INSPECTOR_B64 = ''
          APK_PIN = '685c115ee432d5fd2d7be856a58ea0cb029c9c187aa9061f3cd250994dfbcf2a'
          LIBG_PIN = '110aa2b5cac391c498645e072b0d88729428c2c2845e7e2737ca8ee979059783'
          OBSERVED_BYTES = 794_497_101
          MAX_BYTES = 1_000_000_000
          AUTHORIZED_RUN_NUMBER = '2'  # Run1 consumed; next attempt requires separate approval.
          METADATA_ENDPOINT = 'https://ckdatabasews.icloud.com/database/1/com.apple.clouddocs/production/public/records/resolve'


          class StopIntake(Exception):
              pass


          # Error output must never inherit a URL, token or server-supplied exception text.
          PUBLIC_FAILURE_CODES = frozenset({
              'INTERRUPTED_OR_STAGE_TIMEOUT', 'CLEANUP_PATH_REFUSED', 'CLEANUP_OWNERSHIP_REFUSED',
              'METADATA_DESTINATION_OR_STATUS', 'METADATA_ENCODING', 'METADATA_LIMIT',
              'METADATA_RESULT_COUNT', 'ANONYMOUS_ACCESS_UNCONFIRMED', 'METADATA_FILE_SIZE_CHANGED',
              'DOWNLOAD_DESTINATION_REFUSED', 'DOWNLOAD_DESTINATION_OR_STATUS', 'DOWNLOAD_ENCODING',
              'DOWNLOAD_TYPE', 'DOWNLOAD_LENGTH', 'NOT_APK_ZIP_PREFIX', 'STREAM_SIZE_MISMATCH',
              'WHOLE_APK_HASH_MISMATCH_STOP', 'ONE_SHOT_NONROOT_HOST_GUARD',
              'MISSING_OR_INVALID_PRIVATE_SECRET', 'TEMP_STORAGE_LOW', 'REVIEWED_INSPECTOR_CHANGED',
              'ARM64_LIBG_MISMATCH', 'DEX_HEADER_ANOMALY', 'ARM64_LIBRARY_HEADER_ANOMALY',
              'FINGERPRINT_SIZE_LIMIT', 'UNEXPECTED_EXECUTABLE_MEMBERS_REVIEW_REQUIRED',
          })


          def secret_share_key(secret):
              # The repository owner rotated the link. Trust only this one secret input,
              # never a visible workflow parameter, source literal or user-chosen endpoint.
              # File identity still requires the unchanged original APK SHA256 below.
              if not isinstance(secret, str) or not 0 < len(secret) <= 8192:
                  raise StopIntake('MISSING_OR_INVALID_PRIVATE_SECRET')
              # urlsplit strips some control characters; reject rather than normalize them.
              if (any(c.isspace() or ord(c) < 32 or ord(c) == 127 for c in secret)
                      or '\\' in secret or secret[0] in "\"'" or secret[-1] in "\"'"
                      or '"' in secret or secret.count('#') > 1
                      or '?' in secret.split('#', 1)[0]):
                  raise StopIntake('MISSING_OR_INVALID_PRIVATE_SECRET')
              source = urlsplit(secret)
              prefixes = {'www.icloud.com': '/iclouddrive/', 'drive.icloud.com': '/shared/'}
              prefix = prefixes.get(source.netloc)
              if (source.scheme != 'https' or not prefix or source.query
                      or source.username is not None or source.password is not None
                      or not source.path.startswith(prefix)):
                  raise StopIntake('MISSING_OR_INVALID_PRIVATE_SECRET')
              key = source.path.removeprefix(prefix)
              # 25 is verified by the earlier anonymous Apple resolution. Retain the
              # existing 22-character accepted form without claiming it was live-validated.
              if not re.fullmatch(r'(?:[A-Za-z0-9_-]{22}|[A-Za-z0-9_-]{25})', key):
                  raise StopIntake('MISSING_OR_INVALID_PRIVATE_SECRET')
              return key


          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None


          def interrupted(signum, frame):
              raise StopIntake('INTERRUPTED_OR_STAGE_TIMEOUT')


          def scratch():
              root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
              return root / 'firstlight-icloud-one'


          def cleanup():
              p = scratch()
              if not p.exists():
                  return
              if p.is_symlink() or p.parent != Path(os.environ['RUNNER_TEMP']).resolve(strict=True):
                  raise StopIntake('CLEANUP_PATH_REFUSED')
              marker = p / '.owner'
              if not marker.is_file() or marker.read_text() != os.environ['GITHUB_RUN_ID']:
                  raise StopIntake('CLEANUP_OWNERSHIP_REFUSED')
              shutil.rmtree(p)


          def metadata(opener, key):
              req = Request(METADATA_ENDPOINT + '?' + urlencode({'sharing_url_key': key}),
                  data=json.dumps({'shortGUIDs': [{'value': key}]}).encode(), method='POST',
                  headers={'Content-Type': 'application/json', 'Accept-Encoding': 'identity'})
              with opener.open(req, timeout=15) as response:
                  if response.status != 200 or response.geturl() != req.full_url:
                      raise StopIntake('METADATA_DESTINATION_OR_STATUS')
                  if response.headers.get('Content-Encoding', 'identity') != 'identity':
                      raise StopIntake('METADATA_ENCODING')
                  raw = response.read(2_000_001)
                  if len(raw) > 2_000_000:
                      raise StopIntake('METADATA_LIMIT')
                  value = json.loads(raw)
              results = value.get('results')
              if not isinstance(results, list) or len(results) != 1:
                  raise StopIntake('METADATA_RESULT_COUNT')
              result = results[0]
              if result.get('requireAppleLogin') is not False or result.get('serverErrorCode'):
                  raise StopIntake('ANONYMOUS_ACCESS_UNCONFIRMED')
              asset = result['rootRecord']['fields']['fileContent']['value']
              if type(asset.get('size')) is not int or asset['size'] != OBSERVED_BYTES:
                  raise StopIntake('METADATA_FILE_SIZE_CHANGED')
              url = asset['downloadURL']
              target = urlsplit(url)
              if (target.scheme != 'https' or target.netloc != 'cvws.icloud-content.com'
                      or target.username or target.password or target.fragment or len(url) > 16384):
                  raise StopIntake('DOWNLOAD_DESTINATION_REFUSED')
              return url, len(raw)


          def acquire(opener, url, path, metadata_bytes, report):
              # New request, no Authorization/Cookie/Referer from metadata, no redirects.
              req = Request(url, headers={'Accept-Encoding': 'identity'}, method='GET')
              with opener.open(req, timeout=15) as response:
                  if response.status != 200 or response.geturl() != url:
                      raise StopIntake('DOWNLOAD_DESTINATION_OR_STATUS')
                  if response.headers.get('Content-Encoding', 'identity') != 'identity':
                      raise StopIntake('DOWNLOAD_ENCODING')
                  if response.headers.get_content_type() not in ('application/octet-stream',
                          'application/vnd.android.package-archive', 'application/zip'):
                      raise StopIntake('DOWNLOAD_TYPE')
                  lengths = response.headers.get_all('Content-Length', [])
                  if (len(lengths) > 1 or (lengths and (not lengths[0].isascii()
                          or not lengths[0].isdecimal() or int(lengths[0]) != OBSERVED_BYTES))):
                      raise StopIntake('DOWNLOAD_LENGTH')
                  count = 0
                  digest = hashlib.sha256()
                  with path.open('xb') as output:
                      while count < MAX_BYTES - metadata_bytes:
                          part = response.read(min(1024 * 1024, MAX_BYTES - metadata_bytes - count))
                          if not part:
                              break
                          count += len(part)
                          if count == len(part) and not part.startswith(b'PK\x03\x04'):
                              raise StopIntake('NOT_APK_ZIP_PREFIX')
                          output.write(part)
                          digest.update(part)
                          report['bytes_downloaded'] = count
                  report['sha256'] = digest.hexdigest()
                  report['hash_match'] = report['sha256'] == APK_PIN
                  if count != OBSERVED_BYTES:
                      raise StopIntake('STREAM_SIZE_MISMATCH')
                  report['download_completed'] = True
                  if not report['hash_match']:
                      raise StopIntake('WHOLE_APK_HASH_MISMATCH_STOP')


          def main():
              report = dict(download_completed=False, bytes_downloaded=0, sha256=None,
                  hash_match=False, structural_inspection='NOT_RUN', signature_verification='NOT_PERFORMED_SEPARATE_GATE',
                  publisher_authentication='UNVERIFIED', native_execution=False,
                  artifact_upload=False, retry=False, run_id=os.environ.get('GITHUB_RUN_ID'), cleanup=False)
              created = False
              try:
                  if (platform.system() != 'Linux' or os.geteuid() == 0
                          or os.environ.get('GITHUB_REPOSITORY') != 'THEFLOLZX/v.1'
                          or os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch'
                          or os.environ.get('GITHUB_RUN_NUMBER') != AUTHORIZED_RUN_NUMBER
                          or os.environ.get('GITHUB_RUN_ATTEMPT') != '1'):
                      raise StopIntake('ONE_SHOT_NONROOT_HOST_GUARD')
                  resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
                  resource.setrlimit(resource.RLIMIT_FSIZE, (1_100_000_000, 1_100_000_000))
                  resource.setrlimit(resource.RLIMIT_AS, (1_500_000_000, 1_500_000_000))
                  os.umask(0o077)
                  key = secret_share_key(os.environ.pop('FIRSTLIGHT_ICLOUD_SHARE_URL', ''))
                  for sig in (signal.SIGALRM, signal.SIGINT, signal.SIGTERM):
                      signal.signal(sig, interrupted)
                  p = scratch()
                  p.mkdir(mode=0o700)
                  created = True
                  (p / '.owner').write_text(os.environ['GITHUB_RUN_ID'])
                  if shutil.disk_usage(p).free < 4_000_000_000:
                      raise StopIntake('TEMP_STORAGE_LOW')
                  opener = build_opener(ProxyHandler({}), HTTPSHandler(context=ssl.create_default_context()), NoRedirect())
                  signal.alarm(30)
                  url, overhead = metadata(opener, key)
                  signal.alarm(180)
                  path = p / 'candidate.apk'
                  acquire(opener, url, path, overhead, report)
                  url = key = None
                  signal.alarm(100)
                  raw = base64.b64decode(INSPECTOR_B64, validate=True)
                  if hashlib.sha256(raw).hexdigest() != INSPECTOR_PIN:
                      raise StopIntake('REVIEWED_INSPECTOR_CHANGED')
                  namespace = {'__name__': 'reviewed_static_inspector'}
                  exec(compile(raw, 'reviewed_static_inspector.py', 'exec'), namespace)
                  with path.open('rb') as stream:
                      inventory = namespace['inspect_stream'](stream, path.stat().st_size)
                  rows = {r['name']: r for r in inventory['entries']}
                  libg = rows.get('lib/arm64-v8a/libg.so', {})
                  if libg.get('sha256') != LIBG_PIN or libg.get('format_header', {}).get('aarch64') is not True:
                      raise StopIntake('ARM64_LIBG_MISMATCH')
                  for row in inventory['entries']:
                      header = row.get('format_header', {})
                      if header.get('format') == 'DEX-header' and any(header.get(k) is not True for k in
                              ('magic_valid','file_size_matches','supported_header','checksum_matches','signature_sha1_matches')):
                          raise StopIntake('DEX_HEADER_ANOMALY')
                      if row['name'].startswith('lib/arm64-v8a/') and row['name'].endswith('.so'):
                          if header.get('aarch64') is not True or header.get('shared_object') is not True:
                              raise StopIntake('ARM64_LIBRARY_HEADER_ANOMALY')
                  version = None
                  if 'assets/fingerprint.json' in rows:
                      if rows['assets/fingerprint.json']['bytes'] > 2_000_000:
                          raise StopIntake('FINGERPRINT_SIZE_LIMIT')
                      with zipfile.ZipFile(path) as archive:
                          fingerprint = json.loads(archive.read('assets/fingerprint.json'))
                      observed = fingerprint.get('version')
                      if isinstance(observed, str) and re.fullmatch(r'[0-9.]{1,40}', observed):
                          version = observed
                  report.update(structural_inspection='PASS', entry_count=inventory['entry_count'],
                      uncompressed_bytes=inventory['uncompressed_bytes'], libg_sha256=libg['sha256'],
                      arm64_libg_match=True, dex_count=len(inventory['dex_members']),
                      native_library_count=len(inventory['native_libraries']),
                      unexpected_executable_count=len(inventory['unexpected_executable_suffixes']),
                      bundled_content={name:dict(bytes=rows[name]['bytes'],sha256=rows[name]['sha256'])
                          for name in ('assets/fingerprint.json','assets/assets.scdb') if name in rows},
                      bundled_fingerprint_version_evidence=version,
                      android_manifest_decoded=False, full_content_verified=False, training_eligible=False)
                  if report['unexpected_executable_count']:
                      raise StopIntake('UNEXPECTED_EXECUTABLE_MEMBERS_REVIEW_REQUIRED')
              except HTTPError as exc:
                  report['failure'] = 'HTTP_DENIED_OR_NON_SUCCESS_STOP'
                  if type(exc.code) is int and 100 <= exc.code <= 599:
                      report['http_status'] = exc.code
                  try:
                      exc.close()
                  except BaseException:
                      pass  # Never let close() reveal a secret-bearing HTTP exception chain.
              except StopIntake as exc:
                  code = exc.args[0] if len(exc.args) == 1 and isinstance(exc.args[0], str) else None
                  report['failure'] = code if code in PUBLIC_FAILURE_CODES else 'ERROR_DETAILS_REDACTED'
              except BaseException:
                  report['failure'] = 'UNEXPECTED_ERROR_DETAILS_REDACTED'
              finally:
                  signal.alarm(0)
                  if created:
                      try:
                          cleanup()
                          report['cleanup'] = True
                      except BaseException:
                          report['cleanup'] = False
                          report['failure'] = 'CLEANUP_FAILED'
                  print(json.dumps(report, sort_keys=True))
              return 1 if 'failure' in report else 0


          if __name__ == '__main__':
              raise SystemExit(main())
          FIRSTLIGHT_PY
      - name: Remove this run's scratch directory after failure or cancellation
        if: ${{ always() }}
        shell: bash --noprofile --norc -e {0}
        run: |
          python3 -I - <<'FIRSTLIGHT_CLEAN'
          import json, os, shutil
          from pathlib import Path
          try:
              root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
              p = root / 'firstlight-icloud-one'
              if p.exists():
                  if p.is_symlink() or p.parent != root or (p/'.owner').read_text() != os.environ['GITHUB_RUN_ID']:
                      raise ValueError()
                  shutil.rmtree(p)
              print(json.dumps({'fallback_cleanup_complete':not p.exists()}))
          except BaseException:
              print(json.dumps({'fallback_cleanup_complete':False,'failure':'CLEANUP_DETAILS_REDACTED'}))
              raise SystemExit(1)
          FIRSTLIGHT_CLEAN
