name: FirstLight quarantine security ONE RUN
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: firstlight-quarantined-build
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'THEFLOLZX/v.1' && github.run_number == 2 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Exact pinned APK static malware and privacy indicators
        env:
          FIRSTLIGHT_ICLOUD_SHARE_URL: ${{ secrets.FIRSTLIGHT_ICLOUD_SHARE_URL }}
        shell: bash --noprofile --norc -e {0}
        run: |
          timeout --signal=TERM --kill-after=1s 1150s python3 -I - <<'QUARANTINE_PY'
          import base64,hashlib,json,os,platform,resource,signal,ssl
          SOURCES={'TRANSPORT': '', 'READER': '', 'CLAIMS': '', 'SECURITY': '', 'PROFILE': '', 'TOOLS': ''}
          PINS={'TRANSPORT': '7f52b93c7c45c4621bec8d506e54d0a1fd222e4c90c19e1ff3eb64e36e54c13f', 'READER': '4f3f12a7f9f5a5db7cfcd268575df1fd2a29fc251f9575b7662d9e056ffc1a50', 'CLAIMS': '96bad37f7b330c55243c6551fe3630ced8120c2a6f7c70c82808ae71961425db', 'SECURITY': 'bcd5e4844bf60b3e1fc50b56185b64e622ff9bc47c6e40272d68876561d7fb96', 'PROFILE': '842d9d35870d1f600ad35e37a37edee7bcac0c11f7e338c37c67420de3a1011e', 'TOOLS': 'b3665844acce4c7d4ce953e40cb5fe290466b8a7a217b82db777b958ad4c21a4'}
          SIGNATURE_EVIDENCE={'prior_run_id': 45014292153, 'android_api31_v2_strict_pass': True, 'full_range_v1_v2_crypto_verified': True, 'full_range_werr_pass': False, 'full_range_warning_codes': {'JAR_UNPROTECTED_ZIP_ENTRY': 9}, 'publisher_identity': 'UNKNOWN', 'report_sha256': 'febc5cd49a90c5c0dc954f99598a0d89895f210a9ee3781ef3836b9a0e96aa07'}
          def load(name):
              raw=base64.b64decode(SOURCES[name],validate=True)
              if hashlib.sha256(raw).hexdigest()!=PINS[name]:raise ValueError('OWNED_SOURCE_CHANGED')
              scope={'__name__':'reviewed_owned_'+name}
              exec(compile(raw,'reviewed_owned_'+name,'exec'),scope)
              return scope
          def emit():print(json.dumps(report,sort_keys=True),flush=True)
          def stop(*args):raise KeyboardInterrupt()
          report={'schema':'firstlight-quarantine-security-run.v1','run_id':os.environ.get('GITHUB_RUN_ID'),
              'apk_executed':False,'native_libraries_loaded':False,'tools_installed':False,'publisher_identity':'UNKNOWN',
              'publisher_authenticated':False,'build_success':False,'native_boot_verified':False,'match_verified':False}
          transport=None;created=False
          try:
              report['stage']='HOST_GUARD'
              if not (platform.system()=='Linux' and os.geteuid()!=0 and platform.machine()=='x86_64'
                  and os.environ.get('GITHUB_REPOSITORY')=='THEFLOLZX/v.1'
                  and os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch'
                  and os.environ.get('GITHUB_RUN_NUMBER')=='2' and os.environ.get('GITHUB_RUN_ATTEMPT')=='1'
                  and os.environ.get('GITHUB_REF')=='refs/heads/main'
                  and os.environ.get('GITHUB_WORKFLOW_REF')=='THEFLOLZX/v.1/.github/workflows/firstlight-quarantine-security.yml@refs/heads/main'):
                  raise ValueError('HOST_GUARD')
              resource.setrlimit(resource.RLIMIT_CORE,(0,0));resource.setrlimit(resource.RLIMIT_AS,(1500000000,1500000000))
              resource.setrlimit(resource.RLIMIT_FSIZE,(1100000000,1100000000));os.umask(0o077)
              transport=load('TRANSPORT');reader=load('READER');tools=load('TOOLS');claims=load('CLAIMS');security=load('SECURITY');profile=load('PROFILE')
              scratch=transport['scratch']();scratch.mkdir(mode=0o700);created=True
              (scratch/'.owner').write_text(os.environ['GITHUB_RUN_ID'])
              if transport['shutil'].disk_usage(scratch).free<4000000000:raise ValueError('DISK_SPACE')
              for sig in (signal.SIGALRM,signal.SIGTERM,signal.SIGINT):signal.signal(sig,stop)
              report['stage']='APPLE_RESOLUTION';signal.alarm(30)
              key=transport['secret_share_key'](os.environ.pop('FIRSTLIGHT_ICLOUD_SHARE_URL',''))
              opener=transport['build_opener'](transport['ProxyHandler']({}),transport['HTTPSHandler'](context=ssl.create_default_context()),transport['NoRedirect']())
              url,overhead=transport['metadata'](opener,key)
              report['stage']='EXACT_INPUT_TRANSFER';signal.alarm(180);transfer={};path=scratch/'candidate.apk'
              try:transport['acquire'](opener,url,path,overhead,transfer)
              except transport['StopIntake'] as exc:
                  if exc.args!=('WHOLE_APK_HASH_MISMATCH_STOP',):raise
              url=key=None
              report.update(bytes_downloaded=transfer.get('bytes_downloaded'),whole_sha256=transfer.get('sha256'))
              if transfer.get('download_completed')is not True or transfer.get('bytes_downloaded')!=794497101 or transfer.get('sha256')!=profile['APK']:
                  raise ValueError('EXPERIMENTAL_INPUT_MISMATCH')
              report['diagnostic_candidate_hash_match']=True;report['strict_original_profile_admitted']=False
              report['stage']='STATIC_SECURITY';signal.alarm(900)
              security['inspect'](path,reader,tools,claims,report,emit)
              context=profile['QuarantinedBuildInput'](report['static_security']['engine_measurement'],SIGNATURE_EVIDENCE,
                  opt_in=profile['PROFILE'],purpose='static-inspection')
              report['experimental_admission']=context.receipt()
              report['status']='STATIC_FINDINGS_COLLECTED_NOT_MALWARE_CLEARANCE'
          except BaseException as exc:
              report['status']='FAILED_CLOSED'
              if 'static_security' in report:report['static_security']['status']='FAILED_WITH_PARTIAL_FINDINGS'
              fixed=exc.args[0] if type(exc)is ValueError and len(exc.args)==1 else None
              allowed={'HOST_GUARD','DISK_SPACE','OWNED_SOURCE_CHANGED','EXPERIMENTAL_INPUT_MISMATCH',
                  'SECURITY_INPUT_GATE','SECURITY_DIRECTORY','SECURITY_CODE_COUNT','SECURITY_MEMBER_PATH',
                  'SECURITY_STREAM_LIMIT','SECURITY_LIBG_CHANGED','SECURITY_LIBG_HEADER','SECURITY_ENDPOINT_LIMIT','SECURITY_MANIFEST_LIMIT'}
              report['failure_code']=fixed if isinstance(fixed,str) and fixed in allowed else 'STATIC_SECURITY_FAILURE_REDACTED'
          finally:
              signal.alarm(0)
              if created and transport:
                  try:transport['cleanup']();report['cleanup']=True
                  except BaseException:report['cleanup']=False;report['status']='CLEANUP_FAILED'
              emit()
          raise SystemExit(0 if report.get('status')=='STATIC_FINDINGS_COLLECTED_NOT_MALWARE_CLEARANCE' and report.get('cleanup')is True else 1)
          QUARANTINE_PY
      - name: Remove this run's scratch directory after failure or cancellation
        if: ${{ always() }}
        shell: bash --noprofile --norc -e {0}
        run: |
          python3 -I - <<'FIRSTLIGHT_CLEAN'
          import json, os, shutil
          from pathlib import Path
          try:
              root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
              p = root / 'firstlight-icloud-one'
              if p.exists():
                  if p.is_symlink() or p.parent != root or (p/'.owner').read_text() != os.environ['GITHUB_RUN_ID']:
                      raise ValueError()
                  shutil.rmtree(p)
              print(json.dumps({'fallback_cleanup_complete':not p.exists()}))
          except BaseException:
              print(json.dumps({'fallback_cleanup_complete':False,'failure':'CLEANUP_DETAILS_REDACTED'}))
              raise SystemExit(1)
          FIRSTLIGHT_CLEAN
