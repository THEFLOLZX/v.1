name: FirstLight single APK static intake
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: firstlight-single-apk-static-intake
  cancel-in-progress: false
jobs:
  static-intake:
    if: github.event_name == 'workflow_dispatch' && github.run_number == 1 && github.run_attempt == 1 && github.repository == 'THEFLOLZX/v.1' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: One approved transfer and read-only static inspection
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          timeout --signal=TERM --kill-after=1s 330s python3 -I -B - <<'PY'
          INSPECTOR_PIN = '738305850976adf79c091291b32fbd4f83a3f8562c4d3ef0f1d6170119f42339'
          INSPECTOR_BASE64 = ''
          import base64, hashlib, json, os, platform, shutil, signal, ssl, tempfile
          from pathlib import Path
          from urllib.request import Request, build_opener, ProxyHandler, HTTPSHandler, HTTPRedirectHandler
          from urllib.error import HTTPError
          
          URL = 'https://tempweb.nullsusercontent.com/fpapk/nr_15.535.13_release_ff1c6c29.apk'
          MAX_BYTES = 1_000_000_000
          EXPECTED_APK = '685c115ee432d5fd2d7be856a58ea0cb029c9c187aa9061f3cd250994dfbcf2a'
          EXPECTED_LIBG = '110aa2b5cac391c498645e072b0d88729428c2c2845e7e2737ca8ee979059783'
          
          class StopIntake(Exception):
              pass
          
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          def deadline(signum, frame):
              raise StopIntake('stage deadline exceeded')
          
          def acquire(opener, path):
              request = Request(URL, method='GET', headers={'Accept-Encoding': 'identity'})
              # Exactly one open, no retry, cookies, authentication, proxy or redirect handler.
              try:
                  response = opener.open(request, timeout=15)
              except HTTPError as error:
                  code = error.code
                  error.close()  # Do not read denial pages or retry.
                  print(json.dumps({'acquisition': 'FAILED', 'http_status': code,
                                    'body_bytes_read': 0, 'retry': False}))
                  raise StopIntake('HTTP non-success; stop') from None
              with response:
                  if response.status != 200 or response.geturl() != URL:
                      raise StopIntake('unexpected response status or destination')
                  mime = response.headers.get_content_type()
                  if mime not in ('application/vnd.android.package-archive', 'application/octet-stream'):
                      raise StopIntake('unexpected content type')
                  if response.headers.get('Content-Encoding', 'identity').lower() != 'identity':
                      raise StopIntake('unexpected transfer content encoding')
                  values = response.headers.get_all('Content-Length', [])
                  if len(values) > 1:
                      raise StopIntake('ambiguous content length')
                  length = None
                  if values:
                      if not values[0].isascii() or not values[0].isdecimal():
                          raise StopIntake('invalid content length')
                      length = int(values[0])
                      if not 0 < length <= MAX_BYTES:
                          raise StopIntake('declared size exceeds approval')
                  digest = hashlib.sha256()
                  count = 0
                  with path.open('xb') as output:
                      while count < MAX_BYTES:
                          part = response.read(min(1024 * 1024, MAX_BYTES - count))
                          if not part:
                              break
                          count += len(part)
                          output.write(part)
                          digest.update(part)
                          if length is not None and count == length:
                              break
                  # Never read a probe byte beyond the approved cap. Unknown length at cap
                  # is conservatively rejected rather than attempting to establish EOF.
                  if count == 0 or (length is not None and count != length) or (length is None and count == MAX_BYTES):
                      raise StopIntake('incomplete or boundary-ambiguous transfer')
                  print(json.dumps({'acquisition': 'COMPLETED', 'http_status': 200,
                                    'bytes_read': count, 'sha256': digest.hexdigest(),
                                    'declared_content_length': length, 'redirects': 0, 'retries': 0}))
                  return digest.hexdigest()
          
          def main():
              if platform.system() != 'Linux' or os.geteuid() == 0:
                  raise StopIntake('nonroot Linux hosted runner required')
              import resource
              os.umask(0o077)
              resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
              resource.setrlimit(resource.RLIMIT_FSIZE, (1_100_000_000, 1_100_000_000))
              resource.setrlimit(resource.RLIMIT_AS, (1_500_000_000, 1_500_000_000))
              signal.signal(signal.SIGALRM, deadline)
              signal.signal(signal.SIGTERM, deadline)
              folder = Path(tempfile.mkdtemp(prefix='firstlight-static-one-'))
              try:
                  if shutil.disk_usage(folder).free < 4_000_000_000:
                      raise StopIntake('less than4GB free temporary storage')
                  raw = base64.b64decode(INSPECTOR_BASE64, validate=True)
                  if hashlib.sha256(raw).hexdigest() != INSPECTOR_PIN:
                      raise StopIntake('reviewed inspector changed')
                  namespace = {'__name__': 'reviewed_static_inspector'}
                  # Execute ONLY our hash-pinned source, never any downloaded content.
                  exec(compile(raw, 'reviewed_archive_inspector.py', 'exec'), namespace)
                  path = folder / 'candidate.apk'
                  signal.alarm(180)
                  opener = build_opener(ProxyHandler({}), HTTPSHandler(context=ssl.create_default_context()), NoRedirect())
                  downloaded_hash = acquire(opener, path)
                  signal.alarm(120)
                  with path.open('rb') as source:
                      report = namespace['inspect_stream'](source, path.stat().st_size)
                  signal.alarm(0)
                  libg = [r for r in report['entries'] if r['name'] == 'lib/arm64-v8a/libg.so']
                  hashes_match = (downloaded_hash == report['whole_sha256'] == EXPECTED_APK
                                  and len(libg) == 1 and libg[0]['sha256'] == EXPECTED_LIBG)
                  report['pinned_component_hashes_match'] = hashes_match
                  report['compatibility_verdict'] = 'UNVERIFIED' if hashes_match else 'REJECTED_PIN_MISMATCH'
                  report['package_evidence'] = {'expected_package': 'nullsroyale.rel.free',
                      'expected_version': '15.535.13', 'expected_version_code': 150535013,
                      'actual_manifest_decoded': False}
                  report['content_15_535_86_verified'] = False
                  report['signature_verification_approved'] = False
                  payload = json.dumps(report, ensure_ascii=True, indent=2)
                  if len(payload.encode('utf-8')) > 16_000_000:
                      raise StopIntake('inspection output limit')
                  print('STATIC_INVENTORY_BEGIN')
                  print(payload)
                  print('STATIC_INVENTORY_END')
                  if not hashes_match:
                      raise StopIntake('critical hash mismatch; no further action')
              finally:
                  signal.alarm(0)
                  # Only this process-created private temporary directory; no extracted files.
                  shutil.rmtree(folder)
                  print(json.dumps({'temporary_directory_removed': True,
                                    'apk_executed': False, 'artifact_uploaded': False}))
          
          if __name__ == '__main__':
              try:
                  main()
              except Exception as error:
                  # Fixed exception class only; never echo untrusted server text/URLs/content.
                  print(json.dumps({'result': 'FAILED', 'reason_type': type(error).__name__,
                                    'no_retry': True, 'execution_authorized': False}))
                  raise SystemExit(1)
          PY
