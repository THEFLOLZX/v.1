name: FirstLight STANDALONE SIGNATURE AND CONTENT ONE RUN
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: firstlight-private-static-intake
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'THEFLOLZX/v.1' && github.run_number == 7 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: One secret-scoped cloud-only acquisition and static inspection
        env:
          FIRSTLIGHT_ICLOUD_SHARE_URL: ${{ secrets.FIRSTLIGHT_ICLOUD_SHARE_URL }}
        shell: bash --noprofile --norc -e {0}
        run: |
          timeout --signal=TERM --kill-after=1s 330s python3 -I - <<'FIRSTLIGHT_PY'
          """Separate candidate-pinned DIAGNOSTIC; never changes the trusted engine pin.

          Unpublished proposal. This does not authenticate, approve, build or run an APK.
          Existing transport may reject the original pin; only the exact measured candidate
          may then enter this separately approved, static-only diagnostic scope.
          """
          import base64
          import hashlib
          import json
          import os
          import platform
          import signal
          import ssl
          import zipfile
          import struct

          AUTHORIZED_RUN_NUMBER = '7'  # Same path; runs1..4 consumed. NOT authorization to dispatch.

          STAGE_FAILURE_CODES = {
              'INSPECTOR_SOURCE_LOAD': 'INSPECTOR_SOURCE_REJECTED',
              'CLAIMS_PARSER_SOURCE_LOAD': 'CLAIMS_SOURCE_REJECTED',
              'INDEPENDENT_SOURCE_LOAD': 'INDEPENDENT_SOURCE_REJECTED',
              'NATIVE_EVIDENCE_COLLECTION': 'INDEPENDENT_COLLECTION_FAILED',
              'ZIP_STRUCTURE_AND_MEMBER_HASHES': 'ZIP_INSPECTION_FAILED',
              'BINARY_MANIFEST_PARSE': 'MANIFEST_PARSE_FAILED',
              'BUNDLED_FINGERPRINT_PARSE': 'FINGERPRINT_PARSE_FAILED',
              'APK_SIGNING_BLOCK_PARSE': 'SIGNING_BLOCK_PARSE_FAILED',
              'ARM64_LIBG_COMPARISON': 'LIBG_COMPARISON_FAILED',
              'RESULTS_ASSEMBLY': 'RESULTS_ASSEMBLY_FAILED',
          }


          def exception_category(exc):
              # Fixed labels only. Never use str/repr(exc), __name__ or traceback data.
              for kind, label in ((MemoryError, 'MemoryError'), (zipfile.BadZipFile, 'BadZipFile'),
                      (UnicodeError, 'UnicodeError'), (struct.error, 'StructError'),
                      (ValueError, 'ValueError'), (KeyError, 'KeyError'), (TypeError, 'TypeError'),
                      (TimeoutError, 'TimeoutError'), (OSError, 'OSError')):
                  if isinstance(exc, kind):return label
              return 'OTHER_REDACTED'


          class DiagnosticFailure(Exception):
              pass


          def stage_call(report, stage, operation, rules=()):
              code = STAGE_FAILURE_CODES[stage]  # All callers supply project-owned constants.
              report['stage'] = stage
              try:
                  result = operation()
              except BaseException as exc:
                  if isinstance(exc,StaticInterrupted):raise
                  rule = getattr(exc, 'code', None)
                  report['failure_code'] = rule if type(rule) is str and rule in rules else code
                  if report['failure_code'] in rules:
                      # Project-owned rule exception; never format exception messages.
                      allowed = ('entry_index','archive_bytes','bytes_read','central_bytes',
                          'declared_entries','entries_checked','members_verified','member_bytes',
                          'compressed_bytes','total_uncompressed_bytes','block_bytes','pair_index')
                      allowed += ('extra_bytes','extra_offset','extra_remaining_bytes','extra_record_index',
                          'extra_declared_payload_bytes','possible_trailing_zero_bytes')
                      allowed += ('signer_index','chain_index','field_offset','container_bytes','declared_field_bytes')
                      counters = getattr(exc, 'counters', {})
                      report['failure_counters'] = {k:counters[k] for k in allowed if k in counters
                          and type(counters[k]) is int and 0 <= counters[k] < 2**63}
                  report['exception_type'] = exception_category(exc)
                  raise DiagnosticFailure() from None
              report.setdefault('completed_stages', []).append(stage)
              return result

          CANDIDATE_SHA256 = 'da4fdba452a552aaf5843f595bdb383bc313cb097d719b2e103b383ee5fcf00e'
          ORIGINAL_SHA256 = '685c115ee432d5fd2d7be856a58ea0cb029c9c187aa9061f3cd250994dfbcf2a'
          LIBG_SHA256 = '110aa2b5cac391c498645e072b0d88729428c2c2845e7e2737ca8ee979059783'
          COMMUNITY_CERT_SHA256 = '7107a093895781d774710e621650d78312c0c58ea3097526f6a5c7130fc5c78f'
          TRUSTED_PUBLISHER_CERT_SHA256 = None  # No independently authenticated anchor.
          TRANSPORT_B64 = ''
          TRANSPORT_SHA256 = '7f52b93c7c45c4621bec8d506e54d0a1fd222e4c90c19e1ff3eb64e36e54c13f'
          INSPECTOR_B64 = ''
          INSPECTOR_SHA256 = 'b3665844acce4c7d4ce953e40cb5fe290466b8a7a217b82db777b958ad4c21a4'
          CLAIMS_B64 = ''
          CLAIMS_SHA256 = '942be038f2f338545e57432cacaec30b9f0484d78fc32cee91bca74f6089038e'
          INDEPENDENT_B64 = ''
          INDEPENDENT_SHA256 = '4f3f12a7f9f5a5db7cfcd268575df1fd2a29fc251f9575b7662d9e056ffc1a50'


          def reviewed_source(encoded, expected):
              raw = base64.b64decode(encoded, validate=True)
              if hashlib.sha256(raw).hexdigest() != expected:raise ValueError('Reviewed source changed')
              ns = {'__name__': 'reviewed_data_only_module'}
              exec(compile(raw, 'reviewed_data_only_module.py', 'exec'), ns)
              return ns


          def require_candidate(transfer):
              if (transfer.get('download_completed') is not True or transfer.get('bytes_downloaded') != 794_497_101
                      or transfer.get('sha256') != CANDIDATE_SHA256):
                  raise ValueError('Exact observed candidate required')






          class StaticInterrupted(BaseException):pass


          def static_interrupted(*args):raise StaticInterrupted()


          def host_eligible():
              return (platform.system()=='Linux' and platform.machine()=='x86_64' and os.geteuid()!=0
                  and os.environ.get('GITHUB_REPOSITORY')=='THEFLOLZX/v.1'
                  and os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch'
                  and os.environ.get('GITHUB_RUN_NUMBER')==AUTHORIZED_RUN_NUMBER
                  and os.environ.get('GITHUB_RUN_ATTEMPT')=='1'
                  and os.environ.get('GITHUB_REF')=='refs/heads/main'
                  and os.environ.get('GITHUB_WORKFLOW_REF')=='THEFLOLZX/v.1/.github/workflows/firstlight-standalone-signature-base.yml@refs/heads/main')


          def main():
              report = dict(schema='firstlight-candidate-static-diagnostic.v1', status='NOT_RUN',
                  diagnostic_expected_sha256=CANDIDATE_SHA256, trusted_original_sha256=ORIGINAL_SHA256,
                  trusted_original_accepted=False, original_pin_unchanged=True, diagnostic_candidate_hash_match=False,
                  execution_authorized=False, build_authorized=False, training_eligible=False,
                  signature_crypto_verified=False, publisher_authenticated=False, retry=False,
                  run_id=os.environ.get('GITHUB_RUN_ID'), cleanup=False)
              created = False;transport = None;alarms_configured = False
              try:
                  report['stage']='HOST_GUARD'
                  if not host_eligible():raise ValueError('One new diagnostic job only')
                  import resource  # Linux job only. Tests replace it; never change local limits.
                  resource.setrlimit(resource.RLIMIT_CORE,(0,0))
                  resource.setrlimit(resource.RLIMIT_FSIZE,(1_100_000_000,1_100_000_000))
                  resource.setrlimit(resource.RLIMIT_AS,(1_500_000_000,3_000_000_000))
                  os.umask(0o077)
                  transport = reviewed_source(TRANSPORT_B64,TRANSPORT_SHA256)
                  if transport['APK_PIN']!=ORIGINAL_SHA256:raise ValueError('Original transport gate changed')
                  path = transport['scratch']();path.mkdir(mode=0o700);created=True
                  (path/'.owner').write_text(os.environ['GITHUB_RUN_ID'])
                  if transport['shutil'].disk_usage(path).free < 4_000_000_000:raise ValueError('Storage low')
                  signal.signal(signal.SIGALRM,static_interrupted);signal.signal(signal.SIGTERM,static_interrupted)
                  alarms_configured=True
                  report['stage']='SECRET_FORMAT'
                  key = transport['secret_share_key'](os.environ.pop('FIRSTLIGHT_ICLOUD_SHARE_URL',''))
                  for sig in (signal.SIGALRM,signal.SIGTERM,signal.SIGINT):
                      signal.signal(sig,transport['interrupted'])
                  alarms_configured = True
                  opener = transport['build_opener'](transport['ProxyHandler']({}),
                      transport['HTTPSHandler'](context=ssl.create_default_context()),transport['NoRedirect']())
                  report['stage']='APPLE_METADATA'
                  signal.alarm(30);url,overhead=transport['metadata'](opener,key)
                  report['stage']='CANDIDATE_TRANSFER'
                  signal.alarm(180);transfer={};candidate=path/'candidate.apk'
                  try:
                      transport['acquire'](opener,url,candidate,overhead,transfer)
                  except transport['StopIntake'] as exc:
                      if exc.args!=('WHOLE_APK_HASH_MISMATCH_STOP',):raise
                      # This rejection remains true. It is NOT an alternate trusted pin.
                      report['original_trusted_intake_rejected']=True
                  report.update(download_completed=transfer.get('download_completed',False),
                      bytes_downloaded=transfer.get('bytes_downloaded',0),whole_sha256=transfer.get('sha256'))
                  report['stage']='DIAGNOSTIC_EXACT_HASH_GATE'
                  require_candidate(transfer)
                  report['diagnostic_candidate_hash_match']=True
                  url=key=None
                  # Cancellation/timeouts must not be swallowed as one branch failure.
                  for sig in (signal.SIGALRM,signal.SIGTERM,signal.SIGINT):signal.signal(sig,static_interrupted)
                  signal.alarm(80)
                  passed=inspect_consolidated(candidate,transfer,report)
                  report['status']='STATIC_DIAGNOSTIC_COMPLETE_NOT_AUTHENTICATED' if passed else 'STATIC_DIAGNOSTIC_PARTIAL_NOT_AUTHENTICATED'
                  report['stage']='COMPLETE'
              except BaseException as exc:
                  # An inner stage already records its fixed failure code. Pre-parser errors
                  # get one generic code; neither path emits exception messages.
                  fixed=getattr(exc,'code',None)
                  if fixed in RUNTIME_CODES:report['failure_code']=fixed
                  report.setdefault('failure_code','STATIC_INTERRUPTED' if isinstance(exc,StaticInterrupted) else 'PRE_INSPECTION_FAILED')
                  report.setdefault('exception_type',exception_category(exc))
                  report['status']='STATIC_DIAGNOSTIC_FAILED_DETAILS_REDACTED'
              finally:
                  if alarms_configured:signal.alarm(0)
                  if created and transport:
                      try:transport['cleanup']();report['cleanup']=True
                      except BaseException as exc:
                          report['status']='CLEANUP_FAILED'
                          report['cleanup_failure_code']='SCRATCH_CLEANUP_FAILED'
                          report['cleanup_exception_type']=exception_category(exc)
                  print(json.dumps(report,sort_keys=True))
              return 0 if report['status']=='STATIC_DIAGNOSTIC_COMPLETE_NOT_AUTHENTICATED' else 1



          from pathlib import Path
          RUNTIME_PROFILE={'schema': 'firstlight-standalone-runtime.v1', 'execution_authorized': True, 'version': '17.0.21.1+2', 'kind': 'Temurin HotSpot JRE Linux x64 glibc', 'archive_url': 'https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.21.1%2B2/OpenJDK17U-jre_x64_linux_hotspot_17.0.21.1_2.tar.gz', 'archive_bytes': 46737725, 'archive_sha256': '5a092a0bc21de4c3d855480edd7945be9cfe157b38cdb84dac280511893bb009', 'archive_root': 'jdk-17.0.21.1+2-jre', 'publisher_digest_sources': ['https://api.adoptium.net/v3/assets/version/17.0.21.1%2B2?architecture=x64&heap_size=normal&image_type=jre&jvm_impl=hotspot&os=linux&vendor=eclipse', 'https://api.github.com/repos/adoptium/temurin17-binaries/releases/tags/jdk-17.0.21.1%2B2'], 'github_asset_id': 764920608, 'publisher_metadata_agreement_verified': True, 'publisher_channels_independently_read': True, 'channels_share_publisher_control': True, 'openpgp_signature_verified': False, 'publisher_openpgp_fingerprint_documented': '3B04D753C9050D9A5D343F39843C48A565F8F04B', 'openpgp_reference': 'https://adoptium.net/installation/gpg-verification', 'artifact_downloaded_or_inspected': False, 'actual_member_layout_verified': False, 'maximum_uncompressed_bytes': 320000000, 'maximum_member_bytes': 160000000, 'maximum_entries': 5000, 'external_archive_links_allowed': False, 'host_cacerts_access_allowed': False, 'host_native_policy': 'managed GitHub runner OS; exact native dependency inventory reported, not vendor-authenticated by the JRE digest', 'managed_host_native_baseline_approved': True, 'apksigner_jar_path': '/usr/local/lib/android/sdk/build-tools/36.1.0/lib/apksigner.jar', 'apksigner_jar_sha256': '71e18adf733f5e112d1f062dbe6b0c2eb439a4d7c773d083c42a703c66f56df1', 'apksigner_independent_distribution_evidence_run': 45002203016, 'prior_runtime_cacerts_probe': 45004091531, 'original_production_profiles_changed': False, 'security_update_reference': 'https://www.oracle.com/java/technologies/javase/17-0-21-1-relnotes.html', 'metadata_reviewed_at': '2026-11-22', 'superseded_initial_candidate': '17.0.21+9 - not acquired or used', 'metadata_response_sha256': {'adoptium': '76084532655ae91aa3627e0216adad773aa16c316322b27df02cfa6b15bb1503', 'github': '0ba89885932641e33f69892083bb7ebb0ad472b62ecb319c09e1c88d215e62c5'}, 'apksigner_launcher_sha256': 'b47549e373b895ce6ca620d0c7887e674d9615ffa837a86ac601dcfd04adb0f0', 'warning_diagnostic_authorized': False}
          RUNTIME_B64=''
          RUNTIME_SHA256='c570995ee77d15a4852a29bb47c154a3c199246e97064ac6bf3ec9b1f3a47783'
          SIGNATURE_B64=''
          SIGNATURE_SHA256='b18d4edfbc79e1c84c19a7e4e457e66c6dddddd28d5f50123768bdd53a98c0f1'
          CONTENT_B64=''
          CONTENT_SHA256='e90c8ee7bdf04a483d18538f39d49c38e146c0c6caf6a0651b4c4ec203abdd85'
          TAR_HELPERS_B64=''
          TAR_HELPERS_SHA256='38092533bed1c945ddc127b7d46bcff5d6767fe2226ef6fab710c75465a231a6'
          CONFIG_B64=''
          CONFIG_SHA256='4c18a24b3c8d9570bf1a699a35b597454cdec80c0cd5daa0fc43b2d256c0b166'

          RUNTIME_CODES=frozenset('APPROVAL_REQUIRED HOST_BASELINE_NOT_APPROVED RUNTIME_SOURCE RUNTIME_HTTP RUNTIME_REDIRECT RUNTIME_TRANSFER_LIMIT RUNTIME_DIGEST RUNTIME_LAYOUT RUNTIME_LINK RUNTIME_MEMBER_IDENTITY RUNTIME_CERT_STORE RUNTIME_RELEASE RUNTIME_ELF RUNTIME_DEPENDENCY RUNTIME_HOST_DEPENDENCY RUNTIME_FILE_CHANGED VERIFIER_JAR_CHANGED VERIFIER_LAUNCHER_CHANGED ARCHIVE_LIMIT ARCHIVE_PATH ARCHIVE_DUPLICATE ARCHIVE_TYPE TAR_FORMAT TAR_METADATA TAR_TRAILING COMPRESSION_UNSUPPORTED PACKAGE_TARGET_MISSING PACKAGE_LINK_LOOP PACKAGE_LINK_ESCAPE'.split())

          def emit(report):print(json.dumps(report,sort_keys=True),flush=True)

          def bootstrap_standalone(scratch,runtime_stage,report):
              global signature_stage,signature_tools,runtime_identity,runtime_root
              signature_stage=reviewed_source(SIGNATURE_B64,SIGNATURE_SHA256)
              jar=Path(RUNTIME_PROFILE['apksigner_jar_path'])
              if signature_stage['file_hash'](jar,[0])!=RUNTIME_PROFILE['apksigner_jar_sha256']:
                  raise runtime_stage['RuntimeErrorCode']('VERIFIER_JAR_CHANGED')
              launcher=jar.parent.parent/'apksigner'
              if signature_stage['file_hash'](launcher,[0])!=RUNTIME_PROFILE['apksigner_launcher_sha256']:
                  raise runtime_stage['RuntimeErrorCode']('VERIFIER_LAUNCHER_CHANGED')
              signature_stage['jar_execution_preflight'](jar)
              report['tool_identity']=dict(jar_sha256=RUNTIME_PROFILE['apksigner_jar_sha256'],
                  launcher_sha256=RUNTIME_PROFILE['apksigner_launcher_sha256'],jar_match=True,launcher_match=True,
                  launcher_executed=False);emit(report)
              archive=scratch/'vendor-jre.tar.gz'
              report['runtime_transfer']=runtime_stage['acquire_runtime'](RUNTIME_PROFILE,archive);emit(report)
              helpers=reviewed_source(TAR_HELPERS_B64,TAR_HELPERS_SHA256)
              runtime_root=scratch/'private-jre'
              runtime_identity=runtime_stage['stage_runtime'](archive,runtime_root,RUNTIME_PROFILE,helpers)
              report['runtime_identity']={k:v for k,v in runtime_identity.items() if k!='files'}
              report['runtime_identity']['file_count']=len(runtime_identity['files'])
              report['runtime_identity']['manifest_sha256']=hashlib.sha256(json.dumps(runtime_identity['files'],sort_keys=True).encode()).hexdigest()
              config=reviewed_source(CONFIG_B64,CONFIG_SHA256)
              configuration=config['provider_configuration']((runtime_root/'conf/security/java.security').read_bytes())
              report['private_runtime_configuration']=configuration
              allowed_providers={'SUN','SunRsaSign','SunEC','SunJSSE','SunJCE','SunJGSS','SunSASL','XMLDSig','SunPCSC','JdkLDAP','JdkSASL','SunPKCS11'}
              if configuration['additional_property_sources_declared'] or any(p['value'] not in allowed_providers for p in configuration['providers']):
                  raise runtime_stage['RuntimeErrorCode']('RUNTIME_LAYOUT')
              report['runtime_native_dependencies']=runtime_stage['native_inventory'](runtime_root,runtime_identity['files'])
              report['managed_host_native_baseline_accepted']=True
              report['host_os_libraries_vendor_authenticated_by_jre_digest']=False
              target=scratch/'private-verifier/lib/apksigner.jar';target.parent.mkdir(parents=True,mode=0o700)
              with jar.open('rb') as source,target.open('xb') as out:
                  for block in iter(lambda:source.read(1048576),b''):out.write(block)
              if signature_stage['file_hash'](target,[0])!=RUNTIME_PROFILE['apksigner_jar_sha256']:
                  raise runtime_stage['RuntimeErrorCode']('VERIFIER_JAR_CHANGED')
              signature_tools=dict(java=runtime_root/'bin/java',java_home=runtime_root,sdk=scratch/'private-verifier',large_apk_verifier=True)
              archive.unlink();emit(report)

          RESOURCE_RECOVERY_B64=''
          RESOURCE_RECOVERY_SHA256='14d4d7d730ffcb16cb427b3817b552a8821cbf12cd62dc41bd4cf6ae50c8a0be'
          def inspect_consolidated(path,transfer,report):
              require_candidate(transfer)
              report.update(prior_signature_evidence_run=45014292153,signature_verifier_executed=False,
                  runtime_downloaded=False,strict_signature_policy_passed=False,publisher_authenticated=False,
                  native_and_full_zip_checks_repeated=False,build_authorized=False,preview_build_ready=False,
                  production_training_eligible=False)
              reader=reviewed_source(INDEPENDENT_B64,INDEPENDENT_SHA256)
              tools=reviewed_source(INSPECTOR_B64,INSPECTOR_SHA256)
              content=reviewed_source(CONTENT_B64,CONTENT_SHA256)
              startup=report.setdefault('startup_reconstruction',{})
              report['stage']='STATIC_PREVIEW_CATALOGS'
              recovery=reviewed_source(RESOURCE_RECOVERY_B64,RESOURCE_RECOVERY_SHA256)
              try:content['collect_startup'](path,reader,tools,startup,lambda:emit(report),recovery=recovery['recover'])
              except Exception as exc:
                  startup['failure']=exc.code if isinstance(exc,content['ContentError']) else 'CONTENT_FORMAT'
              emit(report)
              return 'failure' not in startup



          if __name__=='__main__':
              raise SystemExit(main())
          FIRSTLIGHT_PY
      - name: Remove this run's scratch directory after failure or cancellation
        if: ${{ always() }}
        shell: bash --noprofile --norc -e {0}
        run: |
          python3 -I - <<'FIRSTLIGHT_CLEAN'
          import json, os, shutil
          from pathlib import Path
          try:
              root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
              p = root / 'firstlight-icloud-one'
              if p.exists():
                  if p.is_symlink() or p.parent != root or (p/'.owner').read_text() != os.environ['GITHUB_RUN_ID']:
                      raise ValueError()
                  shutil.rmtree(p)
              print(json.dumps({'fallback_cleanup_complete':not p.exists()}))
          except BaseException:
              print(json.dumps({'fallback_cleanup_complete':False,'failure':'CLEANUP_DETAILS_REDACTED'}))
              raise SystemExit(1)
          FIRSTLIGHT_CLEAN
