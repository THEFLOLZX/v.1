name: FirstLight TOOLCHAIN CLOSURE ONE RUN
on:
  workflow_dispatch:
permissions: {}
jobs:
  inspect:
    if: github.repository == 'THEFLOLZX/v.1' && github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: One inert official-package comparison
        shell: bash --noprofile --norc -e {0}
        run: |
          timeout --signal=TERM --kill-after=1s 330s python3 -I -B - <<'FIRSTLIGHT_CLOSURE'
          """Cloud-only, inert publisher-package comparison. Never installs/loads tools.

          Network is limited to TWO fixed HTTPS objects, one request each, no redirects.
          All archive reads are data-only, streamed and bounded; no filesystem extraction.
          """
