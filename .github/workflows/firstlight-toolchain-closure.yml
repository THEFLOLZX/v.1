                  import resource
                  resource.setrlimit(resource.RLIMIT_CORE,(0,0));resource.setrlimit(resource.RLIMIT_AS,(1_500_000_000,1_500_000_000))
                  resource.setrlimit(resource.RLIMIT_FSIZE,(300_000_000,300_000_000));os.umask(0o077)
