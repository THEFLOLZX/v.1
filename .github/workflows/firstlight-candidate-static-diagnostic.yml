name: FirstLight candidate STATIC DIAGNOSTIC ONE RUN
on:
  workflow_dispatch:
permissions: {}
jobs:
  inspect:
    if: github.repository == 'THEFLOLZX/v.1' && github.run_number == 5 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: One secret-scoped cloud-only acquisition and static inspection
        env:
          FIRSTLIGHT_ICLOUD_SHARE_URL: ${{ secrets.FIRSTLIGHT_ICLOUD_SHARE_URL }}
        shell: bash --noprofile --norc -e {0}
        run: |
          timeout --signal=TERM --kill-after=1s 330s python3 -I - <<'FIRSTLIGHT_PY'
          """Separate candidate-pinned DIAGNOSTIC; never changes the trusted engine pin.

          Unpublished proposal. This does not authenticate, approve, build or run an APK.
          Existing transport may reject the original pin; only the exact measured candidate
          may then enter this separately approved, static-only diagnostic scope.
          """
          import base64
          import hashlib
          import json
          import os
          import platform
          import signal
          import ssl
          import zipfile
          import struct

          AUTHORIZED_RUN_NUMBER = '5'  # Same path; runs1..4 consumed. NOT authorization to dispatch.

          STAGE_FAILURE_CODES = {
              'INSPECTOR_SOURCE_LOAD': 'INSPECTOR_SOURCE_REJECTED',
              'CLAIMS_PARSER_SOURCE_LOAD': 'CLAIMS_SOURCE_REJECTED',
              'INDEPENDENT_SOURCE_LOAD': 'INDEPENDENT_SOURCE_REJECTED',
              'NATIVE_EVIDENCE_COLLECTION': 'INDEPENDENT_COLLECTION_FAILED',
              'ZIP_STRUCTURE_AND_MEMBER_HASHES': 'ZIP_INSPECTION_FAILED',
              'BINARY_MANIFEST_PARSE': 'MANIFEST_PARSE_FAILED',
              'BUNDLED_FINGERPRINT_PARSE': 'FINGERPRINT_PARSE_FAILED',
              'APK_SIGNING_BLOCK_PARSE': 'SIGNING_BLOCK_PARSE_FAILED',
              'ARM64_LIBG_COMPARISON': 'LIBG_COMPARISON_FAILED',
              'RESULTS_ASSEMBLY': 'RESULTS_ASSEMBLY_FAILED',
          }


          def exception_category(exc):
              # Fixed labels only. Never use str/repr(exc), __name__ or traceback data.
              for kind, label in ((MemoryError, 'MemoryError'), (zipfile.BadZipFile, 'BadZipFile'),
                      (UnicodeError, 'UnicodeError'), (struct.error, 'StructError'),
                      (ValueError, 'ValueError'), (KeyError, 'KeyError'), (TypeError, 'TypeError'),
                      (TimeoutError, 'TimeoutError'), (OSError, 'OSError')):
                  if isinstance(exc, kind):return label
              return 'OTHER_REDACTED'


          class DiagnosticFailure(Exception):
              pass


          def stage_call(report, stage, operation, rules=()):
              code = STAGE_FAILURE_CODES[stage]  # All callers supply project-owned constants.
              report['stage'] = stage
              try:
                  result = operation()
              except BaseException as exc:
                  if isinstance(exc,StaticInterrupted):raise
                  rule = getattr(exc, 'code', None)
                  report['failure_code'] = rule if type(rule) is str and rule in rules else code
                  if report['failure_code'] in rules:
                      # Project-owned rule exception; never format exception messages.
                      allowed = ('entry_index','archive_bytes','bytes_read','central_bytes',
                          'declared_entries','entries_checked','members_verified','member_bytes',
                          'compressed_bytes','total_uncompressed_bytes','block_bytes','pair_index')
                      allowed += ('extra_bytes','extra_offset','extra_remaining_bytes','extra_record_index',
                          'extra_declared_payload_bytes','possible_trailing_zero_bytes')
                      counters = getattr(exc, 'counters', {})
                      report['failure_counters'] = {k:counters[k] for k in allowed if k in counters
                          and type(counters[k]) is int and 0 <= counters[k] < 2**63}
                  report['exception_type'] = exception_category(exc)
                  raise DiagnosticFailure() from None
              report.setdefault('completed_stages', []).append(stage)
              return result

          CANDIDATE_SHA256 = 'da4fdba452a552aaf5843f595bdb383bc313cb097d719b2e103b383ee5fcf00e'
          ORIGINAL_SHA256 = '685c115ee432d5fd2d7be856a58ea0cb029c9c187aa9061f3cd250994dfbcf2a'
          LIBG_SHA256 = '110aa2b5cac391c498645e072b0d88729428c2c2845e7e2737ca8ee979059783'
          COMMUNITY_CERT_SHA256 = '7107a093895781d774710e621650d78312c0c58ea3097526f6a5c7130fc5c78f'
          TRUSTED_PUBLISHER_CERT_SHA256 = None  # No independently authenticated anchor.
          TRANSPORT_B64 = ''
          TRANSPORT_SHA256 = '7f52b93c7c45c4621bec8d506e54d0a1fd222e4c90c19e1ff3eb64e36e54c13f'
          INSPECTOR_B64 = ''
          INSPECTOR_SHA256 = 'b3665844acce4c7d4ce953e40cb5fe290466b8a7a217b82db777b958ad4c21a4'
          CLAIMS_B64 = ''
          CLAIMS_SHA256 = '415a7f8474656ca4365db2e3a5daec0691b6abe6393be8552ae65ff03d01fc76'
          INDEPENDENT_B64 = ''
          INDEPENDENT_SHA256 = 'd53a37a1091539caeede4b88195d669c7ae316e2050b73959f191d29ab9e9225'


          def reviewed_source(encoded, expected):
              raw = base64.b64decode(encoded, validate=True)
              if hashlib.sha256(raw).hexdigest() != expected:raise ValueError('Reviewed source changed')
              ns = {'__name__': 'reviewed_data_only_module'}
              exec(compile(raw, 'reviewed_data_only_module.py', 'exec'), ns)
              return ns


          def require_candidate(transfer):
              if (transfer.get('download_completed') is not True or transfer.get('bytes_downloaded') != 794_497_101
                      or transfer.get('sha256') != CANDIDATE_SHA256):
                  raise ValueError('Exact observed candidate required')


          def inspect_candidate(path, transfer, report, output_budget=None):
              require_candidate(transfer)  # BEFORE either parser receives any APK bytes.
              output_budget=output_budget if output_budget is not None else {'bytes':0}
              findings = report.setdefault('findings', {})
              inspector = stage_call(report, 'INSPECTOR_SOURCE_LOAD',
                  lambda: reviewed_source(INSPECTOR_B64, INSPECTOR_SHA256))
              claims = stage_call(report, 'CLAIMS_PARSER_SOURCE_LOAD',
                  lambda: reviewed_source(CLAIMS_B64, CLAIMS_SHA256))

              def zip_inventory():
                  def safe_checkpoint(facts):
                      print(json.dumps(facts,sort_keys=True),flush=True)
                  with path.open('rb') as stream:
                      result = inspector['inspect_stream'](stream, path.stat().st_size, findings, CANDIDATE_SHA256,safe_checkpoint,output_budget)
                  if result['whole_sha256'] != CANDIDATE_SHA256:inspector['reject']('ZIP_WHOLE_HASH_CHANGED')
                  rows = {r['name']: r for r in result['entries']}
                  findings.update(zip_crc_and_bounded_inventory='PASS', member_count=result['entry_count'],
                      decompressed_bytes=result['uncompressed_bytes'])
                  return result, rows
              inventory, rows = stage_call(report, 'ZIP_STRUCTURE_AND_MEMBER_HASHES', zip_inventory, inspector['RULE_CODES'])

              def capture(archive,name):
                  if output_budget['bytes']+rows[name]['bytes']>2_000_000_000:
                      inspector['reject']('ZIP_STREAM_TOTAL_LIMIT',total_uncompressed_bytes=output_budget['bytes']+rows[name]['bytes'])
                  data=archive.read(name)
                  output_budget['bytes']+=len(data)
                  return data

              def manifest_parse():
                  manifest = rows.get('AndroidManifest.xml')
                  if not manifest or manifest['bytes'] > 2_000_000:raise ValueError('Manifest bound')
                  with zipfile.ZipFile(path) as archive:
                      metadata = claims['manifest_claims'](capture(archive,'AndroidManifest.xml'))
                  findings.update(manifest=metadata, package_version_claims_match=(
                      metadata['package']=='nullsroyale.rel.free' and metadata['version_name']=='15.535.13'
                      and metadata['version_code']==150535013))
              stage_call(report, 'BINARY_MANIFEST_PARSE', manifest_parse, inspector['RULE_CODES'])

              def fingerprint_parse():
                  value = None
                  if 'assets/fingerprint.json' in rows:
                      if rows['assets/fingerprint.json']['bytes'] > 2_000_000:raise ValueError('Fingerprint bound')
                      with zipfile.ZipFile(path) as archive:
                          observed = json.loads(capture(archive,'assets/fingerprint.json'))
                      if not isinstance(observed, dict):raise ValueError('Fingerprint object required')
                      value = observed.get('version')
                      import re
                      if value is not None and (not isinstance(value, str) or not re.fullmatch(r'[0-9.]{1,40}', value)):
                          raise ValueError('Unsupported fingerprint version')
                  findings.update(bundled_fingerprint_present='assets/fingerprint.json' in rows,
                      bundled_fingerprint_version_claim=value,
                      bundled_content={name:dict(bytes=rows[name]['bytes'],sha256=rows[name]['sha256'])
                          for name in ('assets/fingerprint.json','assets/assets.scdb') if name in rows},
                      complete_15_535_86_verified=False)
                  return value
              version = stage_call(report, 'BUNDLED_FINGERPRINT_PARSE', fingerprint_parse, inspector['RULE_CODES'])

              def signing_parse():
                  central = inventory['central_offset']
                  try:
                      with path.open('rb') as stream:block = inspector['signing_block'](stream, central)
                  except OSError:inspector['reject']('SIGN_IO_FAILURE')
                  findings['signing_block_inventory'] = block
                  with path.open('rb') as stream:
                      try:certificates = claims['v2_certificate_claims'](stream, central)
                      except (ValueError,struct.error):inspector['reject']('SIGN_V2_CLAIMS_REJECTED')
                  findings.update(certificate_claims=certificates,
                      matches_community_certificate_claim_only=any(c['chain_index']==0 and c['certificate_der_sha256']==COMMUNITY_CERT_SHA256
                          for c in certificates['v2_certificate_claims']),
                      signature_crypto_verified=False, publisher_authenticated=False,
                      trusted_publisher_certificate_anchor=TRUSTED_PUBLISHER_CERT_SHA256)
              stage_call(report, 'APK_SIGNING_BLOCK_PARSE', signing_parse, inspector['RULE_CODES'])

              def libg_compare():
                  libg = rows.get('lib/arm64-v8a/libg.so')
                  findings['arm64_libg_present'] = libg is not None
                  if libg is None:raise ValueError('Missing required library')
                  header = libg.get('format_header', {})
                  findings.update(arm64_libg_sha256=libg['sha256'], arm64_libg_matches_pin=libg['sha256']==LIBG_SHA256,
                      libg_elf_header=header)
                  if not all(header.get(k) is True for k in ('elf64_little_endian','aarch64','shared_object')):
                      raise ValueError('Unsupported ELF header')
                  if libg['sha256'] != LIBG_SHA256:raise ValueError('Native library mismatch')
              stage_call(report, 'ARM64_LIBG_COMPARISON', libg_compare)

              def assemble():
                  headers = [row['format_header'] for row in rows.values() if 'format_header' in row]
                  dex_anomalies = sum(any(h.get(k) is not True for k in ('magic_valid','file_size_matches',
                      'supported_header','checksum_matches','signature_sha1_matches')) for h in headers if h['format']=='DEX-header')
                  library_hashes = sorted(row['sha256'] for row in rows.values() if row['name'].startswith('lib/arm64-v8a/') and row['name'].endswith('.so'))
                  # No dynamic names/server data/certificate text/secret URLs in output.
                  member_digest = hashlib.sha256(json.dumps([(row['name'],row['bytes'],row['sha256'])
                      for row in sorted(rows.values(),key=lambda row:row['name'])],separators=(',',':')).encode()).hexdigest()
                  findings.update(zip_crc_and_bounded_inventory='PASS', member_count=inventory['entry_count'],
                  decompressed_bytes=inventory['uncompressed_bytes'], member_inventory_digest=member_digest,
                  member_inventory_digest_method='SHA256(canonical JSON sorted name/size/member-SHA256 tuples); not an upstream signature',
                  trusted_reference_member_inventory_available=False, arm64_library_count=len(library_hashes),
                  arm64_library_hashes=library_hashes, dex_header_anomaly_count=dex_anomalies,
                  unexpected_executable_member_count=len(inventory['unexpected_executable_suffixes']),
                  trusted_publisher_certificate_anchor=TRUSTED_PUBLISHER_CERT_SHA256,
                  signature_crypto_verified=False, publisher_authenticated=False,
                  bundled_content={name:dict(bytes=rows[name]['bytes'],sha256=rows[name]['sha256'])
                      for name in ('assets/fingerprint.json','assets/assets.scdb') if name in rows},
                  bundled_csv_logic_member_count=sum(row['name'].startswith('assets/csv_logic/') for row in rows.values()),
                  bundled_fingerprint_version_claim=version, complete_15_535_86_verified=False,
                  signing_variant_explanation='UNPROVEN_WITHOUT_AUTHENTICATED_REFERENCE_ARCHIVE_OR_COMPLETE_INVENTORY')
              stage_call(report, 'RESULTS_ASSEMBLY', assemble)
              return findings


          def inspect_consolidated(path,transfer,report):
              require_candidate(transfer)
              tools=stage_call(report,'INSPECTOR_SOURCE_LOAD',lambda:reviewed_source(INSPECTOR_B64,INSPECTOR_SHA256))
              claims=stage_call(report,'CLAIMS_PARSER_SOURCE_LOAD',lambda:reviewed_source(CLAIMS_B64,CLAIMS_SHA256))
              independent=stage_call(report,'INDEPENDENT_SOURCE_LOAD',lambda:reviewed_source(INDEPENDENT_B64,INDEPENDENT_SHA256))
              evidence=report.setdefault('independent_evidence',{})
              full=report.setdefault('full_archive_diagnostic',{'status':'NOT_RUN'})
              budget={'bytes':0}
              def checkpoint(facts):print(json.dumps(facts,sort_keys=True),flush=True)
              stage_call(report,'NATIVE_EVIDENCE_COLLECTION',
                  lambda:independent['inspect'](path,tools,claims,LIBG_SHA256,evidence,budget,checkpoint))
              # Independent successes cannot waive any full-archive rejection.
              try:
                  inspect_candidate(path,transfer,full,budget)
                  full['status']='PASS_DIAGNOSTIC_ONLY'
              except DiagnosticFailure:
                  full['status']='FAIL'
              finally:
                  report['stream_output_bytes_observed_all_diagnostics']=budget['bytes']
              passed=(full['status']=='PASS_DIAGNOSTIC_ONLY' and all(
                  item['status']=='PASS_DIAGNOSTIC_ONLY' for item in evidence.values()))
              return passed


          class StaticInterrupted(BaseException):pass


          def static_interrupted(*args):raise StaticInterrupted()


          def host_eligible():
              return (platform.system()=='Linux' and os.geteuid()!=0
                  and os.environ.get('GITHUB_REPOSITORY')=='THEFLOLZX/v.1'
                  and os.environ.get('GITHUB_EVENT_NAME')=='workflow_dispatch'
                  and os.environ.get('GITHUB_RUN_NUMBER')==AUTHORIZED_RUN_NUMBER
                  and os.environ.get('GITHUB_RUN_ATTEMPT')=='1')


          def main():
              report = dict(schema='firstlight-candidate-static-diagnostic.v1', status='NOT_RUN',
                  diagnostic_expected_sha256=CANDIDATE_SHA256, trusted_original_sha256=ORIGINAL_SHA256,
                  trusted_original_accepted=False, original_pin_unchanged=True, diagnostic_candidate_hash_match=False,
                  execution_authorized=False, build_authorized=False, training_eligible=False,
                  signature_crypto_verified=False, publisher_authenticated=False, retry=False,
                  run_id=os.environ.get('GITHUB_RUN_ID'), cleanup=False)
              created = False;transport = None;alarms_configured = False
              try:
                  report['stage']='HOST_GUARD'
                  if not host_eligible():raise ValueError('One new diagnostic job only')
                  import resource  # Linux job only. Tests replace it; never change local limits.
                  resource.setrlimit(resource.RLIMIT_CORE,(0,0))
                  resource.setrlimit(resource.RLIMIT_FSIZE,(1_100_000_000,1_100_000_000))
                  resource.setrlimit(resource.RLIMIT_AS,(1_500_000_000,1_500_000_000))
                  os.umask(0o077)
                  transport = reviewed_source(TRANSPORT_B64,TRANSPORT_SHA256)
                  if transport['APK_PIN']!=ORIGINAL_SHA256:raise ValueError('Original transport gate changed')
                  report['stage']='SECRET_FORMAT'
                  key = transport['secret_share_key'](os.environ.pop('FIRSTLIGHT_ICLOUD_SHARE_URL',''))
                  for sig in (signal.SIGALRM,signal.SIGTERM,signal.SIGINT):
                      signal.signal(sig,transport['interrupted'])
                  alarms_configured = True
                  path = transport['scratch']();path.mkdir(mode=0o700);created=True
                  (path/'.owner').write_text(os.environ['GITHUB_RUN_ID'])
                  if transport['shutil'].disk_usage(path).free < 4_000_000_000:raise ValueError('Storage low')
                  opener = transport['build_opener'](transport['ProxyHandler']({}),
                      transport['HTTPSHandler'](context=ssl.create_default_context()),transport['NoRedirect']())
                  report['stage']='APPLE_METADATA'
                  signal.alarm(30);url,overhead=transport['metadata'](opener,key)
                  report['stage']='CANDIDATE_TRANSFER'
                  signal.alarm(180);transfer={};candidate=path/'candidate.apk'
                  try:
                      transport['acquire'](opener,url,candidate,overhead,transfer)
                  except transport['StopIntake'] as exc:
                      if exc.args!=('WHOLE_APK_HASH_MISMATCH_STOP',):raise
                      # This rejection remains true. It is NOT an alternate trusted pin.
                      report['original_trusted_intake_rejected']=True
                  report.update(download_completed=transfer.get('download_completed',False),
                      bytes_downloaded=transfer.get('bytes_downloaded',0),whole_sha256=transfer.get('sha256'))
                  report['stage']='DIAGNOSTIC_EXACT_HASH_GATE'
                  require_candidate(transfer)
                  report['diagnostic_candidate_hash_match']=True
                  url=key=None
                  # Cancellation/timeouts must not be swallowed as one branch failure.
                  for sig in (signal.SIGALRM,signal.SIGTERM,signal.SIGINT):signal.signal(sig,static_interrupted)
                  signal.alarm(100)
                  passed=inspect_consolidated(candidate,transfer,report)
                  report['status']='STATIC_DIAGNOSTIC_COMPLETE_NOT_AUTHENTICATED' if passed else 'STATIC_DIAGNOSTIC_PARTIAL_NOT_AUTHENTICATED'
                  report['stage']='COMPLETE'
              except BaseException as exc:
                  # An inner stage already records its fixed failure code. Pre-parser errors
                  # get one generic code; neither path emits exception messages.
                  report.setdefault('failure_code','STATIC_INTERRUPTED' if isinstance(exc,StaticInterrupted) else 'PRE_INSPECTION_FAILED')
                  report.setdefault('exception_type',exception_category(exc))
                  report['status']='STATIC_DIAGNOSTIC_FAILED_DETAILS_REDACTED'
              finally:
                  if alarms_configured:signal.alarm(0)
                  if created and transport:
                      try:transport['cleanup']();report['cleanup']=True
                      except BaseException as exc:
                          report['status']='CLEANUP_FAILED'
                          report['cleanup_failure_code']='SCRATCH_CLEANUP_FAILED'
                          report['cleanup_exception_type']=exception_category(exc)
                  print(json.dumps(report,sort_keys=True))
              return 0 if report['status']=='STATIC_DIAGNOSTIC_COMPLETE_NOT_AUTHENTICATED' else 1


          if __name__=='__main__':
              raise SystemExit(main())
          FIRSTLIGHT_PY
      - name: Remove this run's scratch directory after failure or cancellation
        if: ${{ always() }}
        shell: bash --noprofile --norc -e {0}
        run: |
          python3 -I - <<'FIRSTLIGHT_CLEAN'
          import json, os, shutil
          from pathlib import Path
          try:
              root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
              p = root / 'firstlight-icloud-one'
              if p.exists():
                  if p.is_symlink() or p.parent != root or (p/'.owner').read_text() != os.environ['GITHUB_RUN_ID']:
                      raise ValueError()
                  shutil.rmtree(p)
              print(json.dumps({'fallback_cleanup_complete':not p.exists()}))
          except BaseException:
              print(json.dumps({'fallback_cleanup_complete':False,'failure':'CLEANUP_DETAILS_REDACTED'}))
              raise SystemExit(1)
          FIRSTLIGHT_CLEAN
